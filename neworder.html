<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Order - Micro Business App</title>
</head>
<body style="font-family: sans-serif; padding: 20px; background-color: #f9f9f9;">
    <h2 style="color: #333;">New Order</h2>
    <div style="background-color: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <!-- Client Name -->
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-size: 14px; color: #666; margin-bottom: 5px;">Client Name</label>
            <input type="text" placeholder="e.g. Jane Doe" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box;">
        </div>
        <!-- WhatsApp Number -->
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-size: 14px; color: #666; margin-bottom: 5px;">WhatsApp Number</label>
            <input type="tel" placeholder="e.g. +919876543210" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box;">
        </div>
        <!-- Service/Item -->
        <div style="margin-bottom: 15px;">
            <label style="display: block; font-size: 14px; color: #666; margin-bottom: 5px;">Service / Item</label>
            <input type="text" placeholder="e.g. Logo Design" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box;">
        </div>
        <!-- Amount -->
        <div style="margin-bottom: 20px;">
            <label style="display: block; font-size: 14px; color: #666; margin-bottom: 5px;">Amount (₹)</label>
            <input type="number" placeholder="e.g. 5000" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box;">
        </div>
        <!-- Save Button -->
        <button style="width: 100%; background-color: #2196f3; color: white; border: none; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold;">
            Save Order
        </button>
        <!-- Cancel Button -->
        <button style="width: 100%; background-color: transparent; color: #666; border: none; padding: 15px; border-radius: 10px; font-size: 14px; margin-top: 10px;">
            Cancel
        </button>
    </div>
</body>
</html>
